name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.15.0 }
      - run: make test
      - run: make bench

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v7
        with: { version: "~> v2", args: release --snapshot --clean }

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        operator: ["1.15.0", "1.16.1"]
        flink: ["1.20", "2.2"]
    name: e2e operator ${{ matrix.operator }} flink ${{ matrix.flink }}
    env:
      FLINK_OPERATOR_VERSION: ${{ matrix.operator }}
      FLINK_VERSION: ${{ matrix.flink }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: helm/kind-action@v1.15.0
        with: { cluster_name: kubectl-flink, config: test/e2e/kind.yaml }
      - run: make kind-deps e2e fixtures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixtures-operator-${{ matrix.operator }}-flink-${{ matrix.flink }}
          path: testdata/fixtures/
          if-no-files-found: ignore
