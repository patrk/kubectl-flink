# The krew-index manifest, rendered by krew-release-bot for each release (.github/workflows/release.yml) and by
# hack/krew-manifest.sh for the first, manual submission. One entry per archive goreleaser builds.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: flink
spec:
  version: {{ .TagName }}
  homepage: https://github.com/patrk/kubectl-flink
  shortDescription: Health and triage of Flink jobs
  description: |
    For the Apache Flink Kubernetes Operator: one health value for every FlinkDeployment and FlinkSessionJob,
    across namespaces and clusters, and the cause of a failing job with its evidence from the operator,
    Kubernetes, the JobManager's logs and its REST API. A live terminal UI, the job graph, exceptions,
    checkpoints, snapshots and a redacted handover bundle for a ticket. Read-only.
  caveats: |
    Tab completion: krew links only the plugin. Copy kubectl_complete-flink from
    ~/.krew/store/flink/{{ .TagName }}/ to a directory on your PATH.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{ addURIAndSha "https://github.com/patrk/kubectl-flink/releases/download/{{ .TagName }}/kubectl-flink_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-flink
    files:
      - from: kubectl-flink
        to: .
      - from: kubectl_complete-flink
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{ addURIAndSha "https://github.com/patrk/kubectl-flink/releases/download/{{ .TagName }}/kubectl-flink_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    bin: kubectl-flink
    files:
      - from: kubectl-flink
        to: .
      - from: kubectl_complete-flink
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{ addURIAndSha "https://github.com/patrk/kubectl-flink/releases/download/{{ .TagName }}/kubectl-flink_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-flink
    files:
      - from: kubectl-flink
        to: .
      - from: kubectl_complete-flink
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{ addURIAndSha "https://github.com/patrk/kubectl-flink/releases/download/{{ .TagName }}/kubectl-flink_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-flink
    files:
      - from: kubectl-flink
        to: .
      - from: kubectl_complete-flink
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{ addURIAndSha "https://github.com/patrk/kubectl-flink/releases/download/{{ .TagName }}/kubectl-flink_{{ .TagName }}_windows_amd64.zip" .TagName }}
    bin: kubectl-flink.exe
    files:
      - from: kubectl-flink.exe
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{ addURIAndSha "https://github.com/patrk/kubectl-flink/releases/download/{{ .TagName }}/kubectl-flink_{{ .TagName }}_windows_arm64.zip" .TagName }}
    bin: kubectl-flink.exe
    files:
      - from: kubectl-flink.exe
        to: .
      - from: LICENSE
        to: .
