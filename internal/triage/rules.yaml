# Default verdict rules. Each names a known pattern in the evidence; why shows the evidence whether or not a rule
# matches. A rule ships with the fixture that triggers it (see TestEveryRuleFires). Profiles add rules in the same
# format. Signals are listed in signals.go.
#
# A rule about a pod's failure needs the pod in that state now: events stay for an hour, so an event alone may tell
# of a startup hiccup that resolved itself, such as the operator's own config ConfigMap not being there yet in the
# first seconds of a deployment. pod.mount carries a FailedMount event only for the pod it is about, while that pod
# is still starting. Other events add detail. Failures where no pod exists, such as quota and admission denials,
# can only be told by events.
rules:
  - id: image-pull
    layer: kubernetes
    severity: FAILED
    when:
      - signal: pod.waiting
        match: '^(?:ImagePullBackOff|ErrImagePull)\b.*?image "(?P<image>[^"]+)"'
    optional:
      - signal: event
        match: '^(?:Failed|ErrImagePull|ImagePullBackOff): .*?(?:pull|pulling)(?: and unpack)? image "[^"]+"'
    supersedes: [jobmanager-crashloop]
    title: 'The image {{.image}} cannot be pulled'
    explain: >-
      Kubernetes cannot pull the image, so the JobManager never starts and the operator reports it in ERROR.
      Either the image or tag does not exist, or the registry refuses the pull.
    remedy: 'Check spec.image and the tag, the registry, and the pull secret of the service account.'

  - id: jar-missing
    layer: runtime
    severity: FAILED
    any:
      - signal: log.jobmanager
        match: "JAR file does not exist '(?P<path>[^']+)'"
      - signal: operator.error
        match: "JAR file does not exist '(?P<path>[^']+)'"
    supersedes: [jobmanager-crashloop]
    title: 'The job jar {{.path}} does not exist'
    explain: >-
      The JobManager exits at startup because spec.job.jarURI points at a file that is not in the image or was
      not downloaded. Kubernetes restarts it, so the pod is in CrashLoopBackOff.
    remedy: 'Fix spec.job.jarURI, or build the jar into the image at that path.'

  - id: jobmanager-crashloop
    layer: kubernetes
    severity: FAILED
    # The pod's state now, or the operator's status.error, which is current too; between restarts the container
    # is running or terminated rather than waiting.
    any:
      - signal: pod.waiting
        match: '^CrashLoopBackOff\b.*\(jobmanager\)$'
      - signal: operator.error
        match: '^CrashLoopBackOff:'
    optional:
      - signal: pod.terminated
        match: '^(?P<termination>\w+ exit \d+).*\(jobmanager\)$'
    title: 'The JobManager crashes at startup{{if .termination}} ({{.termination}}){{end}}'
    explain: >-
      The JobManager container exits and Kubernetes keeps restarting it. The reason is in the log of the previous
      container; the error lines are below.
    remedy: 'kubectl flink logs {{.job}} --previous'

  - id: taskmanager-crashloop
    layer: kubernetes
    severity: DEGRADED
    when:
      - signal: pod.waiting
        match: '^CrashLoopBackOff\b.*\(taskmanager\)$'
    optional:
      - signal: pod.terminated
        match: '^(?P<termination>\w+ exit \d+).*\(taskmanager\)$'
    title: 'A TaskManager crashes at startup{{if .termination}} ({{.termination}}){{end}}'
    explain: >-
      A TaskManager container exits and Kubernetes keeps restarting it, so the job has fewer slots than it needs.
    remedy: 'kubectl flink logs {{.job}} --taskmanagers --previous'

  - id: mount-failed
    layer: kubernetes
    severity: FAILED
    any:
      - signal: pod.mount
        match: '^FailedMount: MountVolume\.SetUp failed for volume "(?P<volume>[^"]+)" : (?P<kind>secret|configmap) "(?P<object>[^"]+)" not found'
      - signal: pod.mount
        match: '^FailedMount: (?P<detail>.+) \(\w+\)$'
    title: '{{if .object}}The {{.kind}} {{.object}} for volume {{.volume}} does not exist{{else}}A volume cannot be mounted{{end}}'
    explain: >-
      The pod cannot start until all its volumes are mounted, so it stays in ContainerCreating.
      {{if not .object}}{{.detail}}{{end}}
    remedy: '{{if .object}}Create the {{.kind}} {{.object}} in namespace {{.namespace}}, or remove the volume from the pod template.{{else}}Check the volumes of the pod template.{{end}}'

  - id: unschedulable
    layer: kubernetes
    severity: STUCK
    when:
      - signal: pod.unschedulable
        match: '(?P<detail>\d+/\d+ nodes are available: [^.]*)'
    optional:
      - signal: event
        match: '^FailedScheduling: '
    title: 'No node can run the pod: {{.detail}}'
    explain: >-
      The scheduler finds no node with the requested resources, labels or tolerations, so the pod stays Pending.
    remedy: 'Lower the resources of the job, or add capacity; check node selectors, affinity and taints.'

  - id: memory-config
    layer: operator
    severity: FAILED
    any:
      - signal: operator.error
        match: '(?P<component>TaskManager|JobManager) memory configuration failed'
      - signal: event
        match: '^Error: (?P<component>TaskManager|JobManager) memory configuration failed'
    title: 'The {{.component}} memory is too small for its configured memory pools'
    explain: >-
      Flink derives its memory pools from spec.{{if eq .component "TaskManager"}}taskManager{{else}}jobManager{{end}}.resource.memory
      and rejects a total smaller than its fixed parts, so the operator does not deploy the change. The sizes are
      in the error below.
    remedy: 'Raise the memory of the {{.component}}, or lower the fixed pools (metaspace, overhead, framework memory) in flinkConfiguration.'

  - id: oom-killed
    layer: kubernetes
    severity: DEGRADED
    when:
      - signal: pod.terminated
        match: '^OOMKilled'
    title: 'A container was killed for exceeding its memory limit'
    explain: >-
      The kernel killed a Flink container because its process used more memory than the pod limit; usually
      native or off-heap memory such as RocksDB, not the Java heap.
    remedy: 'Raise the process memory, or give more to taskmanager.memory.jvm-overhead or managed memory.'

  - id: quota-exceeded
    layer: kubernetes
    severity: FAILED
    any:
      - signal: event
        match: '^(?:FailedCreate|ResourceQuotaReached): .*exceeded quota: (?P<detail>.+)'
      - signal: operator.error
        match: 'exceeded quota: (?P<detail>.+)'
    title: 'The namespace quota does not allow the pods'
    explain: 'Kubernetes refuses to create the pods because the namespace resource quota is used up: {{.detail}}'
    remedy: 'Free resources in the namespace, lower the requests of the job, or raise the quota.'

  - id: admission-denied
    layer: kubernetes
    severity: FAILED
    any:
      - signal: event
        match: 'admission webhook "(?P<webhook>[^"]+)" denied the request: (?P<detail>.+)'
      - signal: operator.error
        match: 'admission webhook "(?P<webhook>[^"]+)" denied the request: (?P<detail>.+)'
    title: 'The admission webhook {{.webhook}} denies the pods'
    explain: 'A policy in the cluster rejects the pods or the resource: {{.detail}}'
    remedy: 'Change the pod template or the resource to meet the policy, or ask its owners for an exception.'

  - id: validation-error
    layer: operator
    severity: FAILED
    any:
      - signal: event
        match: '^ValidationError: (?P<detail>.+)'
    title: 'The operator rejects the spec'
    explain: '{{.detail}}'
    remedy: 'Fix the spec; nothing is deployed until it validates.'

  - id: unsupported-flink-version
    layer: operator
    severity: FAILED
    any:
      - signal: event
        match: '^UnsupportedFlinkVersion: (?P<detail>.+)'
    title: 'The operator does not support this Flink version'
    explain: '{{.detail}}'
    remedy: 'Use a spec.flinkVersion the installed operator supports, or upgrade the operator.'

  - id: taskmanagers-short
    layer: kubernetes
    severity: DEGRADED
    when:
      - signal: health.finding
        match: '(?P<ready>\d+)/(?P<desired>\d+) TaskManagers ready'
    title: 'Only {{.ready}} of {{.desired}} TaskManagers are ready'
    explain: >-
      The job runs with fewer TaskManagers than it asked for, so it has fewer slots than its parallelism needs
      and may not run all tasks.
    remedy: 'Look at the TaskManager pods: kubectl flink logs {{.job}} --taskmanagers'

  - id: checkpoints-stale
    layer: runtime
    severity: DEGRADED
    when:
      - signal: checkpoint.stale
        match: '(?P<detail>.+)'
    optional:
      - signal: checkpoint.failure
        match: '(?P<failure>.+)'
    title: 'Checkpoints are not completing: {{.detail}}'
    explain: >-
      Transactional sinks, such as Kafka with exactly-once delivery, commit only on a completed checkpoint, so
      their consumers see no new data; a restart would replay everything since the last one.
      {{if .failure}}The latest failure: {{.failure}}{{end}}
    remedy: 'kubectl flink checkpoints {{.job}}'

  - id: taskmanager-lost
    layer: runtime
    severity: OK
    any:
      - signal: exception
        match: '(?:TaskExecutor is shutting down|TaskManager with id \S+ is no longer reachable|Heartbeat of TaskManager with id \S+ timed out|Connection unexpectedly closed by remote task manager)'
    optional:
      - signal: checkpoint.restored
        match: '(?P<restored>.+)'
    title: 'The job restarted after losing a TaskManager{{if .restored}}, from {{.restored}}{{end}}'
    explain: >-
      A TaskManager went away, for example its pod was deleted, evicted or its node drained, and Flink restarted
      the job{{if .restored}} from its last checkpoint{{end}}.
    remedy: 'If it happens often, look at node events and kubectl flink exceptions {{.job}}.'

  - id: dependency-unreachable
    layer: runtime
    severity: FAILED
    # The exception may be the cause or the failure itself; the operator also reports it as an event.
    any:
      - signal: exception.cause
        match: '(?P<detail>(?:java\.net\.)?(?:UnknownHost|Connect|NoRouteToHost|SocketTimeout)Exception.*)'
      - signal: exception
        match: '(?P<detail>(?:java\.net\.)?(?:UnknownHost|Connect|NoRouteToHost|SocketTimeout)Exception.*)'
      - signal: operator.error
        match: '(?P<detail>(?:java\.net\.)?(?:UnknownHost|Connect|NoRouteToHost|SocketTimeout)Exception.*)'
      - signal: event
        match: '^JobException: (?P<detail>(?:java\.net\.)?(?:UnknownHost|Connect|NoRouteToHost|SocketTimeout)Exception[^\n]*)'
    title: 'The job cannot reach an external system: {{.detail}}'
    explain: >-
      A source, sink or lookup connects to a host that does not resolve or does not answer, so its task fails.
      Usually the address in the job's configuration is wrong, the system is down, or a network policy or
      firewall blocks the connection.
    remedy: 'Check the address in the job configuration, then reach it from the pod: kubectl exec into the TaskManager.'

  - id: no-restart-strategy
    layer: runtime
    severity: DEGRADED
    any:
      - signal: exception
        match: 'Recovery is suppressed by NoRestartBackoffTimeStrategy'
      - signal: event
        match: 'Recovery is suppressed by NoRestartBackoffTimeStrategy'
    title: 'The job has no restart strategy, so its first failure is final'
    explain: >-
      Without a restart strategy, and without checkpointing, which enables one by default, Flink fails the job on
      the first task failure instead of restarting it.
    remedy: 'Enable checkpointing or set restart-strategy.type, for example exponential-delay, in flinkConfiguration.'

  - id: restart-loop
    layer: runtime
    severity: FAILED
    when:
      - signal: job.restarts
        match: '(?P<count>\d+) failures in the last (?P<window>\S+)'
    optional:
      - signal: exception.cause
        match: '(?P<cause>.+)'
    title: 'The job keeps restarting: {{.count}} failures in the last {{.window}}'
    explain: >-
      The restart strategy restarts the job after every failure, but the failure comes back, so the job never
      runs for long. {{if .cause}}The newest cause: {{.cause}}{{end}}
    remedy: 'kubectl flink exceptions {{.job}}'

  - id: external-restart
    layer: operator
    severity: OK
    when:
      - signal: spec.change
        match: '\brestartNonce : \S+ -> \S+.*\((?P<age>\S+) ago\)'
      - signal: spec.writer
        match: '^restartNonce by (?P<manager>\S+) \(generation (?P<generation>\d+)\)'
    title: 'Restarted through spec.restartNonce {{.age}} ago; {{.manager}} writes the field'
    explain: >-
      Changing spec.restartNonce makes the operator restart the job, and {{.manager}} owns the field. The resource is
      at generation {{.generation}}; if the restarts are not yours, they come from whatever runs as {{.manager}}.
    remedy: 'kubectl get flinkdeployment {{.name}} -n {{.namespace}} --show-managed-fields -o yaml'

  - id: backpressure
    layer: performance
    severity: DEGRADED
    when:
      - signal: performance.backpressure
        match: '(?P<vertex>.+): backpressured (?P<ms>\d+) ms/s'
    optional:
      - signal: performance.bottleneck
        match: '(?P<bottleneck>.+): busy (?P<busy>\d+) ms/s'
    title: '{{.vertex}} is backpressured{{if .bottleneck}}; the bottleneck is {{.bottleneck}}{{end}}'
    explain: >-
      A subtask spends {{.ms}} ms of every second waiting to hand records downstream, so the job runs behind its
      input. {{if .bottleneck}}{{.bottleneck}} is busy {{.busy}} ms/s and cannot keep up.{{end}}
    remedy: >-
      If {{if .bottleneck}}{{.bottleneck}}{{else}}the slow operator{{end}} calls another system, such as a lookup, an
      async request or a sink, that system answers slowly: check its latency first, because more parallelism adds load
      to it. If it computes, raise its parallelism.

  - id: skew
    layer: performance
    severity: DEGRADED
    when:
      - signal: performance.skew
        match: '(?P<vertex>.+): subtasks busy (?P<min>\d+) to (?P<max>\d+) ms/s, receiving (?P<inmin>\d+) to (?P<inmax>\d+) records/s'
    title: '{{.vertex}} is skewed: one subtask does most of the work'
    explain: >-
      Its subtasks are busy between {{.min}} and {{.max}} ms of every second and receive between {{.inmin}} and
      {{.inmax}} records/s. The busiest one is saturated while the others have time to spare, so the operator cannot
      go faster than that one subtask. Usually one key carries most of the records.
    remedy: >-
      Find the hot key, often a default, empty or bot value: filter it out before the keyBy, pre-aggregate it, or add
      a salt to the key. More parallelism does not spread a single key.

  - id: sink-idle
    layer: performance
    severity: DEGRADED
    when:
      - signal: performance.sink-idle
        match: '(?P<detail>.+)'
    title: 'A sink receives no records'
    explain: >-
      {{.detail}}. Either an operator filters everything out, or records are held back, for example in windows
      that never fire because the watermark does not advance.
    remedy: 'Check the filters and the watermarks of the job.'

  - id: ha-leftover
    layer: ha
    severity: DEGRADED
    when:
      - signal: ha.leftover
        match: '(?P<detail>.+)'
    title: 'HA state of an earlier job is left over'
    explain: >-
      The HA ConfigMaps hold {{.detail}}. When the JobManager restarts it recovers every stored job plan, so an old
      job can come back next to, or instead of, the current one.
    remedy: 'Remove the stale keys or ConfigMaps of the old job, with the JobManager stopped.'

  - id: multiple-jobs
    layer: ha
    severity: DEGRADED
    when:
      - signal: jobs.multiple
        match: '(?P<detail>.+)'
    title: 'More than one job runs on an application cluster'
    explain: >-
      {{.detail}}. An application cluster runs one job; a second one usually comes from a job plan the JobManager
      recovered from stale HA state.
    remedy: 'Compare the job ids with status.jobStatus.jobId; kubectl flink exceptions {{.job}}'

  - id: checkpoint-storage-unwritable
    layer: runtime
    severity: FAILED
    any:
      - signal: log.jobmanager
        match: 'Failed to create directory for (?:shared state|[^:]+): (?P<path>\S+)'
      - signal: exception.cause
        match: 'Failed to create directory for (?:shared state|[^:]+): (?P<path>\S+)'
    optional:
      - signal: log.jobmanager
        match: '(?P<storage>Failed to create checkpoint storage)'
    supersedes: [jobmanager-crashloop, restart-loop]
    title: 'Flink cannot write its checkpoint storage at {{.path}}'
    explain: >-
      The JobManager creates the checkpoint directories when the job starts and fails if it cannot. On a volume the
      Flink user (uid 9999 in the official image) needs write access; on object storage, the credentials or the
      bucket are usually wrong.
    remedy: 'Check execution.checkpointing.dir, and that the Flink user can write there.'

  - id: snapshots-ignored
    layer: operator
    severity: DEGRADED
    when:
      - signal: snapshot.ignored
        match: '(?P<detail>.+)'
    title: 'The operator does not process FlinkStateSnapshots'
    explain: >-
      {{.detail}}. The operator decides when it starts whether it handles FlinkStateSnapshots: not when
      kubernetes.operator.snapshot.resource.enabled is false, and not when listing them failed at that moment (it
      then logs that the FlinkStateSnapshot CRD was not installed). The savepoints these resources ask for are not
      taken, and periodic and upgrade snapshots are not recorded.
    remedy: 'Check the operator log from its start and its snapshot.resource.enabled setting; once it can list FlinkStateSnapshots, restart it.'

  - id: savepoint-dir-missing
    layer: runtime
    severity: DEGRADED
    when:
      - signal: snapshot.failing
        match: '^SAVEPOINT (?P<name>\S+) .*(?:savepoint path in the spec or configuration (?P<key>\S+)|state\.savepoints\.dir)'
    supersedes: [snapshot-failing]
    title: 'Savepoint {{.name}} has nowhere to go'
    explain: >-
      Neither the FlinkStateSnapshot nor the job's configuration names a savepoint directory, so the operator
      retries the savepoint without end.
    remedy: 'Set {{if .key}}{{.key}}{{else}}execution.checkpointing.savepoint-dir{{end}} in flinkConfiguration, or spec.savepoint.path on the snapshot.'

  - id: snapshot-failing
    layer: runtime
    severity: DEGRADED
    when:
      - signal: snapshot.failing
        match: '^(?P<type>\S+) (?P<name>\S+)(?: (?P<state>[A-Z_]+))?(?: after (?P<failures>\d+) failures)?(?:: (?P<error>.+))?$'
    title: '{{.type}} {{.name}} fails{{if .state}} ({{.state}}){{end}}'
    explain: >-
      {{if .failures}}The operator tried {{.failures}} times. {{end}}{{if .error}}The last error: {{.error}}{{end}}
    remedy: 'kubectl flink snapshots {{.job}}'
